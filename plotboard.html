/* ツールバーの配置分岐:
 * pointer: fine → boardWrap内に移して選択ブロック近傍のフローティング
 * pointer: coarse → 従来どおり画面下部固定（body直下） */
function placeToolbar(){
  const fine = finePointer();
  toolbarEl.classList.toggle('floating', fine);
  if (fine && toolbarEl.parentElement !== boardWrap) boardWrap.appendChild(toolbarEl);
  if (!fine && toolbarEl.parentElement !== document.body){
    toolbarEl.style.left = '';
    toolbarEl.style.top = '';
    document.body.appendChild(toolbarEl);
  }
}

function updateToolbar(){
  const sel = selectedItems();
  const blks = sel.filter(isBlockItem);
  // 範囲選択のドラッグ中はまだ出さない（確定時に表示）。
  // その場エディタ表示中・ペンモード中も隠す
  const show = sel.length && !state.marquee && !state.editing && state.mode === 'select';
  toolbarEl.classList.toggle('hidden', !show);
  // モバイルは下部固定ツールバーと道具ドックが重なるので、選択中はドックを隠す
  dockEl.classList.toggle('hidden', !!show && !finePointer());
  if (!sel.length) return;
  for (const s of swatchesEl.children){
    s.classList.toggle('active', blks.length > 0 && blks.every(b => b.color === s.dataset.color));
    s.disabled = !blks.length;
  }
  for (const [btn, kind] of [[starBtn, 'star'], [flagBtn, 'flag'], [crossBtn, 'cross']]){
    btn.classList.toggle('active', blks.length > 0 && blks.every(b => b.marks.includes(kind)));
    btn.disabled = !blks.length;
  }
  editBtn.disabled = !(sel.length === 1 && isBlockItem(sel[0])); // テキスト編集は単一ブロックのみ
  const oneImg = sel.length === 1 && sel[0].type === 'image';
  fitBtn.hidden = !oneImg;
  fitBtn.disabled = !oneImg || !naturalAR(state.currentName, oneImg ? sel[0].name : '');
  if (!delBtn.classList.contains('armed')) delBtn.textContent = delLabel();
  // フローティング時は選択範囲の近傍（上、入らなければ下）に配置。
  // 画面隅のアイテムでもはみ出さないようboardWrap内にクランプ
  if (toolbarEl.classList.contains('floating')){
    const PAD = 18; // boardWrapの上・左padding
    const minX = Math.min(...sel.map(b => b.x)) * scale;
    const minY = Math.min(...sel.map(b => b.y)) * scale;
    const maxY = Math.max(...sel.map(b => b.y + b.h)) * scale;
    const tw = toolbarEl.offsetWidth, th = toolbarEl.offsetHeight;
    const left = clamp(PAD + minX, 4, Math.max(4, boardWrap.clientWidth - tw - 4));
    let top = PAD + minY - th - 10;
    if (top < 4) top = PAD + maxY + 10;
    toolbarEl.style.left = left + 'px';
    toolbarEl.style.top = top + 'px';
  }
}

/* ---------- マーク（★/フラッグ/×） ----------
 * ×は「無効・保留などのメモ」を可視化する用途。
 * 複数選択時: 全員が付いていれば全員から外す、そうでなければ全員に付ける */
function toggleMark(kind){
  const sel = selectedBlocks();
  if (!sel.length) return;
  const allHave = sel.every(b => b.marks.includes(kind));
  for (const b of sel){
    const i = b.marks.indexOf(kind);
    if (allHave) b.marks.splice(i, 1);
    else if (i < 0) b.marks.push(kind);
    layoutItem(b);
  }
  updateToolbar();
  scheduleSave();
}
starBtn.addEventListener('click', () => toggleMark('star'));
flagBtn.addEventListener('click', () => toggleMark('flag'));
crossBtn.addEventListener('click', () => toggleMark('cross'));

/* ---------- 全文プレビュー ----------
 * PC: クリップされたブロックへのホバーで表示専用ツールチップ。操作要素を
 *     一切含まないため、ボタンを押しに行く途中で消える問題が構造的に無い
 * モバイル: 選択中ブロックがクリップされていれば画面下部に全文パネル */
function fillTextEls(el, b){
  const [t, rest] = splitText(b.text);
  el.textContent = '';
  const tEl = document.createElement('div');
  tEl.className = 'tt-title';
  tEl.textContent = t;
  el.appendChild(tEl);
  if (rest){
    const rEl = document.createElement('div');
    rEl.textContent = rest;
    el.appendChild(rEl);
  }
}
function updateTextPreview(){
  const busy = state.drag || state.resize || state.placing || state.marquee ||
               state.editing || state.ink || state.mode !== 'select';
  // PCツールチップ（300ms遅延後・テキストがクリップされている時）
  const hoverIt = (!busy && state.hoverReady && state.hoverId) ? getItem(state.hoverId) : null;
  const hb = isBlockItem(hoverIt) ? hoverIt : null;
  if (hb && isClipped(hb.id)){
    fillTextEls(tooltipEl, hb);
    tooltipEl.hidden = false;
    // ブロックの上に表示。入らなければ下に
    const sz = board().size;
    const left = clamp(hb.x * scale, 0, Math.max(0, sz.w * scale - tooltipEl.offsetWidth - 4));
    let top = hb.y * scale - tooltipEl.offsetHeight - 9;
    if (top < 2) top = (hb.y + hb.h) * scale + 9;
    tooltipEl.style.left = left + 'px';
    tooltipEl.style.top = top + 'px';
  } else {
    tooltipEl.hidden = true;
  }
  // モバイル全文パネル（タップで全文が読める）。下部ツールバーの上に出す
  const selIt = (!busy && !finePointer()) ? singleSelItem() : null;
  const sb = isBlockItem(selIt) ? selIt : null;
  if (sb && isClipped(sb.id)){
    fillTextEls(mobilePreviewEl, sb);
    mobilePreviewEl.style.bottom = (toolbarEl.offsetHeight + 28) + 'px';
    mobilePreviewEl.hidden = false;
  } else {
    mobilePreviewEl.hidden = true;
  }
}

/* ---------- その場編集（ポップオーバーエディタ） ----------
 * ブロックに重なって浮かぶtextarea。モーダルへのカーソル大移動を無くす。
 * 確定: 外側クリック / Esc / （設定により）Shift+Enter。
 * キャンセル(破棄)は事故のもとなので持たない（Escも確定扱い）。undoは将来課題 */
function openEditor(id){
  const b = getItem(id);
  if (!isBlockItem(b)) return;
  commitEditor(); // 別ブロックを編集中なら先に確定
  state.editing = { id };
  editorTa.value = b.text;
  editorTa.className = 'color-' + b.color; // ブロックが膨らんだ印象に色を引き継ぐ
  const gw = board().size.w * scale;
  const width = clamp(Math.max(b.w * scale - 4, 170), 100, gw - 8);
  const left = clamp(b.x * scale + 2, 0, Math.max(0, gw - width - 4));
  editorTa.style.left = left + 'px';
  editorTa.style.top = (b.y * scale + 2) + 'px';
  editorTa.style.width = width + 'px';
  editorTa.hidden = false;
  autosizeEditor();
  editorTa.focus();
  editorTa.setSelectionRange(editorTa.value.length, editorTa.value.length);
  editorTa.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  updateToolbar();
  updateTextPreview();
}
// 最小サイズ=ブロックの現寸を保証しつつ、内容に応じて下に拡張
function autosizeEditor(){
  const ed = state.editing;
  if (!ed) return;
  const b = getItem(ed.id);
  const minH = b ? b.h * scale - 4 : 40;
  editorTa.style.height = 'auto';
  editorTa.style.height = Math.max(minH, editorTa.scrollHeight + 2) + 'px';
}
function commitEditor(){
  if (!state.editing) return;
  const b = getItem(state.editing.id);
  state.editing = null;
  editorTa.hidden = true;
  if (b && b.text !== editorTa.value){
    b.text = editorTa.value;
    layoutItem(b);
    scheduleSave();
  }
  updateToolbar();
  updateTextPreview();
}
editorTa.addEventListener('input', autosizeEditor);
editorTa.addEventListener('pointerdown', e => e.stopPropagation());
editorTa.addEventListener('blur', commitEditor);
editorTa.addEventListener('keydown', e => {
  e.stopPropagation();
  if (e.key === 'Escape'){
    if (!lightboxEl.hidden) closeLightbox();
    else if (!dbxPickerEl.hidden) closeDbxPicker();
    else commitEditor(); // Escも確定扱い
  } else if (e.key === 'Enter' && e.shiftKey &&
             getSetting('editorConfirmKey') === 'shift-enter'){
    e.preventDefault();
    commitEditor();
  }
});
// エディタの外側をポインタダウンしたら確定（ライトボックスは内側扱い）
document.addEventListener('pointerdown', e => {
  if (state.editing && e.target !== editorTa && !lightboxEl.contains(e.target)) commitEditor();
});
editBtn.addEventListener('click', () => openEditor(singleSelId()));

/* ============================================================
 * 画像（Phase 4 → Phase 5で「ブロックの添付」から「独立オブジェクト」へ）
 * - 画像はブロックに紐づかず、盤面に自由配置できるアイテム(type:'image')。
 *   1オブジェクト=1画像で、盤面座標の枠にcontainで収める（歪まない）
 * - 追加時にCanvasで長辺1024px以下へ縮小し、WebPエンコード
 *   （非対応ブラウザはJPEGにフォールバック）。元画像はどこにも保持しない
 * - IndexedDBのimagesストアにBlobでキャッシュし、objectURLで表示
 *   （ドラッグ中に再デコードが走らないよう、objectURLは使い回す）
 * - Dropboxへは /PlotBoard/{タイトル名}/img/{ファイル名} に保存。
 *   バイナリの送受信はストレージブリッジ標準の save(Blobを受け付ける)/
 *   loadBinary をそのまま使う（ブリッジのAPIで足りるため独自ラッパーは
 *   書かない。直叩きが必要なのはGCの一覧取得のみ→gcImagesのコメント参照）
 * ============================================================ */
function genImgId(){ return 'img-' + Math.random().toString(36).slice(2, 10); }
// gif/bmpは保存形式ではなく、Dropboxピッカー等から取り込む際の中間型として使う
const IMG_EXT_MIME = { webp: 'image/webp', jpg: 'image/jpeg', jpeg: 'image/jpeg',
                       png: 'image/png', gif: 'image/gif', bmp: 'image/bmp' };
function imgMime(name){
  return IMG_EXT_MIME[name.split('.').pop().toLowerCase()] || 'application/octet-stream';
}

/* ---- クライアント側パイプライン（アップロード前に必ず実施） ---- */
function canvasToBlob(cv, type){
  return new Promise(resolve => cv.toBlob(resolve, type, IMG_QUALITY));
}
async function loadBitmap(file){
  if (window.createImageBitmap){
    try{ return await createImageBitmap(file); }catch(_){ /* 下のImgフォールバックへ */ }
  }
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); resolve(im); };
    im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('画像を読み込めません')); };
    im.src = url;
  });
}
// 長辺IMG_MAX_EDGE以下へ縮小（元がそれ以下なら等倍）→ WebP。
// WebPエンコード非対応ブラウザ（toBlobがPNG等を返す）はJPEGへフォールバック
async function encodeImage(file){
  const bmp = await loadBitmap(file);
  const w0 = bmp.width || bmp.naturalWidth, h0 = bmp.height || bmp.naturalHeight;
  const scale = Math.min(1, IMG_MAX_EDGE / Math.max(w0, h0));
  const cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.round(w0 * scale));
  cv.height = Math.max(1, Math.round(h0 * scale));
  cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  bmp.close?.();
  let blob = await canvasToBlob(cv, 'image/webp');
  let ext = 'webp';
  if (!blob || blob.type !== 'image/webp'){
    blob = await canvasToBlob(cv, 'image/jpeg');
    ext = 'jpg';
  }
  if (!blob || !blob.type.startsWith('image/')) throw new Error('画像の変換に失敗しました');
  // w/h は「置いたときの縦横比」を決めるために返す（枠を元画像の比率で作る）
  return { blob, ext, w: cv.width, h: cv.height };
}

/* ---- 表示用objectURLキャッシュ ---- */
const imgURLs = new Map();    // imgKey -> objectURL
const imgLoading = new Map(); // imgKey -> Promise<string|null>
const imgFailed = new Set();  // ダウンロード失敗（オフライン・未アップロード等）。復帰時にクリア
const imgAR = new Map();      // imgKey -> 元画像の縦横比(w/h)。「元の比率に戻す」で使う
// 読み込み済み画像の縦横比。未読込・取得失敗なら null（ボタンを無効にする）
function naturalAR(title, name){
  if (!title || !name) return null;
  return imgAR.get(imgKey(title, name)) || null;
}

// キャッシュ優先で画像のobjectURLを得る。なければDropboxから
// ダウンロード→キャッシュ→表示。取れなければnull（エラーにしない）
async function ensureImageURL(title, name){
  const key = imgKey(title, name);
  if (imgURLs.has(key)) return imgURLs.get(key);
  if (imgLoading.has(key)) return imgLoading.get(key);
  const p = (async () => {
    let blob = null;
    try{ blob = await idbImgGet(title, name); }catch(_){}
    if (!blob && canCloud() && navigator.onLine && !imgFailed.has(key)){
      try{
        const buf = await storage.loadBinary(title + '/img/' + name);
        blob = new Blob([buf], { type: imgMime(name) });
        await idbImgPut(title, name, blob).catch(() => {});
      }catch(e){
        imgFailed.add(key); // 取れるようになるまでプレースホルダ表示
      }
    }
    if (!blob) return null;
    const url = URL.createObjectURL(blob);
    imgURLs.set(key, url);
    return url;
  })();
  imgLoading.set(key, p);
  try{ return await p; }finally{ imgLoading.delete(key); }
}
// img要素へ非同期に画像を流し込む。解決までは背景色プレースホルダ、
// 取れなければ .img-missing（オフラインプレースホルダ）
function setImgEl(imgEl, title, name){
  const key = imgKey(title, name);
  if (imgEl.dataset.key === key && imgEl.getAttribute('src')) return; // 再デコード防止
  imgEl.dataset.key = key;
  const url = imgURLs.get(key);
  if (url){
    imgEl.src = url;
    imgEl.classList.remove('img-missing');
    return;
  }
  imgEl.removeAttribute('src');
  imgEl.classList.remove('img-missing');
  ensureImageURL(title, name).then(u => {
    if (imgEl.dataset.key !== key) return; // 別の画像に差し替え済み
    if (u){ imgEl.src = u; imgEl.classList.remove('img-missing'); }
    else imgEl.classList.add('img-missing');
  });
}
// 表示できた画像の縦横比を覚えておく（「元の比率に戻す」ボタン用）
function rememberAR(imgEl){
  const key = imgEl.dataset.key;
  if (!key || imgAR.has(key)) return;
  if (imgEl.naturalWidth && imgEl.naturalHeight){
    imgAR.set(key, imgEl.naturalWidth / imgEl.naturalHeight);
    if (!toolbarEl.classList.contains('hidden')) updateToolbar();
  }
}
document.addEventListener('load', e => {
  if (e.target instanceof HTMLImageElement) rememberAR(e.target);
}, true); // loadはバブルしないのでキャプチャで拾う
/* JSONが参照している全画像ファイル名の集合（アップロード整理・GCで使う）。
 * v5の画像オブジェクトに加えて、まだ変換していない旧形式（ブロック添付の
 * images/thumb）も見る: 未オープンの作品レコードは旧構造のままなので、
 * ここを取りこぼすとGCが現役の画像を消してしまう */
function docImageSet(doc){
  const s = new Set();
  for (const bd of doc.boards || []){
    for (const it of (bd.items || bd.blocks || [])){
      if (!it) continue;
      if (it.type === 'image' && typeof it.name === 'string' && it.name) s.add(it.name);
      for (const n of it.images || []) s.add(n);
      if (typeof it.thumb === 'string' && it.thumb) s.add(it.thumb);
    }
  }
  return s;
}

/* ---- 画像オブジェクトの追加 ----
 * 追加はまずIndexedDBに保存して即表示。Dropboxへのアップロードは
 * rec.pendingImgsに積み、既存のJSON同期と同じ遅延・リトライ系統に乗せる
 * （オフラインで追加→オンライン復帰時にsyncDirtyAll経由でアップロードされる）。
 * 削除は「アイテムを消す」だけ。実ファイルは同期成功後のGCが片づける */
const IMG_PLACE_H = 6 * UNIT; // 置いたときの既定の高さ(board-px)。幅は元画像の比率から
async function addImageObjects(files, at){
  if (!state.currentName) return [];
  const title = state.currentName;
  const sz = board().size;
  let pos = at || viewCenterPoint();
  const startX = pos.x;
  const added = [];
  for (const f of files){
    if (!f || !String(f.type).startsWith('image/')) continue;
    try{
      const { blob, ext, w, h } = await encodeImage(f);
      const name = genImgId() + '.' + ext;
      await idbImgPut(title, name, blob);
      imgURLs.set(imgKey(title, name), URL.createObjectURL(blob));
      imgAR.set(imgKey(title, name), w / h);
      // 元画像の比率のまま、盤面に収まる大きさで置く
      let ih = Math.min(IMG_PLACE_H, sz.h), iw = ih * (w / h);
      if (iw > sz.w){ iw = sz.w; ih = iw * (h / w); }
      const it = clampItem(newImageItem(r1(pos.x), r1(pos.y), r1(iw), r1(ih), name));
      items().push(it);
      if (state.rec) (state.rec.pendingImgs ??= []).push(name);
      const el = makeItemEl(it);
      itemEls.set(it.id, el);
      gridEl.appendChild(el);
      layoutItem(it);
      added.push(it.id);
      pos = { x: pos.x + iw + UNIT / 3, y: pos.y }; // 複数枚は右へ並べる
      if (pos.x > sz.w - UNIT) pos = { x: startX, y: pos.y + ih + UNIT / 3 }; // 端で折り返す
    }catch(e){
      console.warn('[img] 追加に失敗:', e);
    }
  }
  if (!added.length) return added;
  setSelection(added);
  scheduleSave();
  return added;
}
// 追加ボタン経由の既定の置き場所。盤面と表示領域の重なりの中心を返すので、
// 盤面が画面より小さい/大きいどちらでも「いま見えている所」に置かれる
function viewCenterPoint(){
  const gr = gridEl.getBoundingClientRect();
  const sr = scroller.getBoundingClientRect();
  const sz = board().size;
  const x = ((Math.max(gr.left, sr.left) + Math.min(gr.right, sr.right)) / 2 - gr.left) / scale;
  const y = ((Math.max(gr.top, sr.top) + Math.min(gr.bottom, sr.bottom)) / 2 - gr.top) / scale;
  return { x: clamp(x, 0, sz.w), y: clamp(y, 0, sz.h) };
}

/* ---- 画像の取り込み口（ファイル選択・貼り付け・D&D・Dropbox） ---- */
let pendingImgPoint = null; // 次に追加する画像の置き場所（board-px。nullなら画面中央）
addImgBtn.addEventListener('click', () => {
  pendingImgPoint = null;
  imgFileInput.click();
});
imgFileInput.addEventListener('change', () => {
  const files = [...imgFileInput.files];
  const at = pendingImgPoint;
  imgFileInput.value = '';
  pendingImgPoint = null;
  if (files.length) addImageObjects(files, at);
});

// クリップボード貼り付け（Ctrl+V / 長押しペースト）。スクリーンショット運用向け。
// テキスト編集中は文字の貼り付けを邪魔しない
document.addEventListener('paste', e => {
  if (boardView.hidden || state.editing) return;
  const files = [];
  for (const it of e.clipboardData?.items || []){
    if (it.kind === 'file' && it.type.startsWith('image/')) files.push(it.getAsFile());
  }
  if (files.length){
    e.preventDefault();
    addImageObjects(files, lastBoardPoint);
  }
});

// ファイルのドラッグ&ドロップ（PC向け）。2系統を1つのパイプラインに合流させる:
//   系統1: ローカルファイルのD&D（e.dataTransfer.files）
//   系統2: Fileviewer窓からのD&D（text/plainにDropboxパスのJSON・Phase 4.5連携）
gridEl.addEventListener('dragover', e => {
  const types = [...(e.dataTransfer?.types || [])];
  // Fileviewerはtext/plainで渡す。preventDefaultしないとdropが発火しない（最重要）
  if (types.includes('Files') || types.includes('text/plain')) e.preventDefault();
});
gridEl.addEventListener('drop', async e => {
  // 落とした位置にそのまま置く（ブロックへの添付ではなくなった）
  const at = boardPoint(e.clientX, e.clientY);

  // 系統1: ローカルファイル
  const files = [...(e.dataTransfer?.files || [])].filter(f => f.type.startsWith('image/'));
  if (files.length){
    e.preventDefault();
    addImageObjects(files, at);
    return;
  }

  // 系統2: Fileviewerからのペイロード。dataTransferはawait後に無効化されるため
  // 文字列の取り出しとpreventDefaultは同期的に済ませる
  const text = e.dataTransfer?.getData('text/plain');
  if (!text) return;
  let payload;
  try{ payload = JSON.parse(text); }catch{ return; } // ただの文字列や外部URLは無視
  if (payload?.source !== 'fileviewer' || !payload.dropboxPath) return;
  e.preventDefault();
  if (!canCloud()){ alert('Fileviewerからの取り込みにはDropbox接続が必要です'); return; }
  try{
    // Dropbox原本を取得 → 既存の画像追加パイプライン（縮小・WebP化・保存・キャッシュ・
    // 遅延アップロード）へ合流。取り込み後は原本と切り離される
    const r = await storage._contentDownload(payload.dropboxPath);
    const blob = new Blob([await r.arrayBuffer()], { type: imgMime(payload.name || payload.dropboxPath) });
    await addImageObjects([blob], at);
  }catch(err){
    console.warn('[fileviewer] 取り込みに失敗:', err);
  }
});

/* ---- ライトボックス（拡大表示。クリック / Escで閉じる） ---- */
function openLightbox(name){
  if (!state.currentName) return;
  setImgEl(lightboxEl.querySelector('img'), state.currentName, name);
  lightboxEl.hidden = false;
}
function closeLightbox(){ lightboxEl.hidden = true; }
lightboxEl.addEventListener('pointerdown', e => e.stopPropagation());
lightboxEl.addEventListener('click', closeLightbox);

/* ---- Dropbox画像ピッカー（Phase 4.5） ----
 * Dropbox上の既存画像をフォルダ閲覧して選び、ブロックに添付する。
 * 直接参照はせず「選んだ画像をダウンロード→縮小→img/へコピー」する
 * （参照を作品フォルダ内に閉じる設計＝GC・リネーム追従・キャッシュの前提を維持）。
 * フォルダ一覧はbasePath外を見るためブリッジのlist()は使えず、dbxMetaと
 * 同方針で_apiFetchを直接使う。ダウンロードは期限切れ自動リトライを持つ
 * _contentDownloadを利用。一覧サムネイルだけはブリッジに相当機能が無いため、
 * 公開APIのgetToken()を使う薄いラッパー（dbxThumbBatch）で直叩きする */
const DBX_IMG_RE = /\.(jpe?g|png|webp|gif|bmp)$/i;
let dbxStack = [];     // 現在のフォルダ階層 [{path, name}]
let dbxPickAt = null;  // 取り込んだ画像を置く盤面座標（nullなら画面中央）
let dbxReqSeq = 0;     // フォルダ遷移と非同期応答の競合防止

function openDbxPicker(at){
  if (!canCloud()) return;
  dbxPickAt = at || null;
  dbxStack = [{ path: '', name: 'Dropbox' }];
  dbxPickerEl.hidden = false;
  loadDbxFolder();
}
function closeDbxPicker(){
  dbxPickerEl.hidden = true;
  dbxListEl.textContent = '';
  dbxPickAt = null;
  dbxReqSeq++; // 進行中の読み込み結果を破棄
}
addDbxBtn.addEventListener('click', () => openDbxPicker(null));
function setDbxStatus(msg){
  dbxStatusEl.hidden = !msg;
  dbxStatusEl.textContent = msg || '';
}
async function loadDbxFolder(){
  const cur = dbxStack[dbxStack.length - 1];
  const seq = ++dbxReqSeq;
  dbxPathEl.textContent = cur.name;
  dbxBackBtn.disabled = dbxStack.length <= 1;
  dbxListEl.textContent = '';
  setDbxStatus('読み込み中…');
  let entries = [];
  try{
    let cursor = null, hasMore = true;
    while (hasMore){
      const d = cursor
        ? await storage._apiFetch('files/list_folder/continue', { cursor })
        : await storage._apiFetch('files/list_folder', { path: cur.path, recursive: false });
      entries = entries.concat(d.entries);
      cursor = d.cursor;
      hasMore = d.has_more;
    }
  }catch(e){
    if (seq === dbxReqSeq) setDbxStatus('読み込みに失敗しました');
    console.warn('[dbx] フォルダ一覧に失敗:', e);
    return;
  }
  if (seq !== dbxReqSeq) return; // 別フォルダへ遷移済み/閉じた
  const folders = entries.filter(e => e['.tag'] === 'folder')
    .sort((a, b) => a.name.localeCompare(b.name, 'ja'));
  const files = entries.filter(e => e['.tag'] === 'file' && DBX_IMG_RE.test(e.name))
    .sort((a, b) => a.name.localeCompare(b.name, 'ja'));
  setDbxStatus(folders.length + files.length ? null : '画像がありません');
  for (const f of folders){
    dbxListEl.appendChild(makeDbxRow(f, '📁', () => {
      dbxStack.push({ path: f.path_lower, name: f.name });
      loadDbxFolder();
    }));
  }
  const thumbEls = new Map(); // path_lower -> アイコン要素（サムネ差し込み先）
  for (const f of files){
    const row = makeDbxRow(f, '🖼', btn => pickDbxFile(f, btn));
    thumbEls.set(f.path_lower, row.querySelector('.dbx-ico'));
    dbxListEl.appendChild(row);
  }
  fillDbxThumbs(files, thumbEls, seq);
}
function makeDbxRow(entry, icon, onClick){
  const row = document.createElement('button');
  row.type = 'button';
  row.className = 'dbx-item';
  const ico = document.createElement('span');
  ico.className = 'dbx-ico';
  ico.textContent = icon;
  const name = document.createElement('span');
  name.className = 'dbx-name';
  name.textContent = entry.name;
  row.append(ico, name);
  row.addEventListener('click', () => onClick(row));
  return row;
}
// 選択 → ダウンロード → 通常の追加パイプライン（縮小・WebP化・キャッシュ・遅延アップロード）
async function pickDbxFile(entry, btn){
  btn.disabled = true;
  setDbxStatus('取り込み中…');
  try{
    const r = await storage._contentDownload(entry.path_lower);
    const blob = new Blob([await r.arrayBuffer()], { type: imgMime(entry.name) });
    const at = dbxPickAt;
    closeDbxPicker();
    await addImageObjects([blob], at);
  }catch(e){
    console.warn('[dbx] 取り込みに失敗:', e);
    btn.disabled = false;
    setDbxStatus('取り込みに失敗しました');
  }
}
// 一覧サムネイル（files/get_thumbnail_batch・25件/回）。取れなくても
// アイコン表示のままで機能に支障はない
async function fillDbxThumbs(files, thumbEls, seq){
  for (let i = 0; i < files.length; i += 25){
    if (seq !== dbxReqSeq) return;
    const chunk = files.slice(i, i + 25);
    let res;
    try{
      res = await dbxThumbBatch(chunk.map(f => f.path_lower));
    }catch(e){
      return;
    }
    if (seq !== dbxReqSeq) return;
    (res.entries || []).forEach((ent, j) => {
      if (ent['.tag'] !== 'success' || !ent.thumbnail) return;
      const ico = thumbEls.get(chunk[j].path_lower);
      if (!ico) return;
      const img = document.createElement('img');
      img.alt = '';
      img.src = 'data:image/jpeg;base64,' + ent.thumbnail;
      ico.textContent = '';
      ico.appendChild(img);
    });
  }
}
async function dbxThumbBatch(paths){
  const doReq = () => fetch('https://content.dropboxapi.com/2/files/get_thumbnail_batch', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + storage.getToken(),
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({
      entries: paths.map(p => ({ path: p, format: 'jpeg', size: 'w128h128' })),
    }),
  });
  let r = await doReq();
  if (r.status === 401){
    await storage._handleExpiry(); // トークン再取得（失敗時はthrow→呼び元で握りつぶす）
    r = await doReq();
  }
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
dbxBackBtn.addEventListener('click', () => {
  if (dbxStack.length > 1){
    dbxStack.pop();
    loadDbxFolder();
  }
});
$('dbxCancel').addEventListener('click', closeDbxPicker);
dbxPickerEl.addEventListener('pointerdown', e => {
  e.stopPropagation(); // エディタの外側クリック確定に掛けない
  if (e.target === dbxPickerEl) closeDbxPicker(); // 背景タップで閉じる
});

/* ---------- コピー（複製直後は配置先選択モード） ----------
 * 複数選択時は相対位置を保ったままグループごと複製・配置する */
let placingEls = [];
copyBtn.addEventListener('click', () => {
  const sel = selectedItems();
  if (!sel.length || state.placing) return;
  const minX = Math.min(...sel.map(b => b.x));
  const minY = Math.min(...sel.map(b => b.y));
  // parts: グループ左上を原点とした相対座標(rx, ry)つきの複製
  const parts = sel.map(src => {
    const proto = JSON.parse(JSON.stringify(src)); // テキスト・色・マーク・画像参照ごと複製
    proto.id = genId();
    return { proto, rx: src.x - minX, ry: src.y - minY };
  });
  const w = Math.max(...sel.map(b => b.x + b.w)) - minX;
  const h = Math.max(...sel.map(b => b.y + b.h)) - minY;
  deselect();
  state.placing = { parts, w, h, bx: minX, by: minY };
  for (const p of parts){
    const el = makePlacePreviewEl(p.proto);
    el.style.left = ((minX + p.rx) * scale) + 'px';
    el.style.top = ((minY + p.ry) * scale) + 'px';
    el.style.width = (p.proto.w * scale) + 'px';
    el.style.height = (p.proto.h * scale) + 'px';
    gridEl.appendChild(el);
    placingEls.push(el);
  }
  placeHint.hidden = false;
  updateTextPreview();
});
function makePlacePreviewEl(proto){
  const el = document.createElement('div');
  if (proto.type === 'image'){
    el.className = 'item image placing-preview';
    const img = document.createElement('img');
    img.alt = ''; img.draggable = false;
    if (state.currentName) setImgEl(img, state.currentName, proto.name);
    el.appendChild(img);
    return el;
  }
  el.className = 'item block placing-preview color-' + proto.color;
  const body = document.createElement('div');
  body.className = 'block-body';
  const [pt, prest] = splitText(proto.text);
  const t = document.createElement('div');
  t.className = 'block-title';
  t.textContent = pt;
  const pm = document.createElement('div');
  pm.className = 'block-rest';
  pm.textContent = prest;
  body.append(t, pm);
  el.appendChild(body);
  return el;
}

function movePlacing(clientX, clientY){
  const p = state.placing;
  if (!p) return;
  const sz = board().size;
  const pt = boardPoint(clientX, clientY);
  // ポインタがグループの中心に来るように置く（自由座標なのでスナップはしない）
  p.bx = clamp(pt.x - p.w / 2, 0, Math.max(0, sz.w - p.w));
  p.by = clamp(pt.y - p.h / 2, 0, Math.max(0, sz.h - p.h));
  p.parts.forEach((part, i) => {
    placingEls[i].style.left = ((p.bx + part.rx) * scale) + 'px';
    placingEls[i].style.top = ((p.by + part.ry) * scale) + 'px';
  });
}

function cancelPlacing(){
  if (!state.placing) return;
  state.placing = null;
  for (const el of placingEls) el.remove();
  placingEls = [];
  placeHint.hidden = true;
}

function finishPlacing(e){
  const p = state.placing;
  const gr = gridEl.getBoundingClientRect();
  const inside = e.clientX >= gr.left - 8 && e.clientX <= gr.right + 8 &&
                 e.clientY >= gr.top - 8 && e.clientY <= gr.bottom + 8;
  if (!inside){ cancelPlacing(); return; } // 盤面外タップで中止
  movePlacing(e.clientX, e.clientY);
  const news = p.parts.map(part => clampItem({
    ...part.proto, x: r1(p.bx + part.rx), y: r1(p.by + part.ry),
  }));
  cancelPlacing();
  for (const nb of news){
    items().push(nb);
    const el = makeItemEl(nb);
    itemEls.set(nb.id, el);
    gridEl.appendChild(el);
    layoutItem(nb);
  }
  setSelection(news.map(nb => nb.id));
  scheduleSave();
}

/* 削除は undo が無いため2度押し方式（誤削除防止）。複数選択なら一括削除 */
let delArmTimer = null;
function delLabel(){
  const n = state.selIds.length;
  return n > 1 ? `削除 (${n})` : '削除';
}
function disarmDelete(){
  clearTimeout(delArmTimer); delArmTimer = null;
  delBtn.classList.remove('armed');
  delBtn.textContent = delLabel();
}
delBtn.addEventListener('click', () => {
  const sel = selectedItems();
  if (!sel.length) return;
  if (!delBtn.classList.contains('armed')){
    delBtn.classList.add('armed');
    delBtn.textContent = sel.length > 1 ? `${sel.length}個を削除？` : '本当に削除？';
    delArmTimer = setTimeout(disarmDelete, 2500);
    return;
  }
  for (const b of sel){
    const i = items().indexOf(b);
    if (i >= 0) items().splice(i, 1);
    itemEls.get(b.id)?.remove();
    itemEls.delete(b.id);
    if (state.hoverId === b.id) state.hoverId = null;
  }
  state.selIds = [];
  disarmDelete();
  updateToolbar();
  updateTextPreview();
  scheduleSave();
});

/* ---------- 盤面サイズ（端のグリップをドラッグして広げる/縮める） ----------
 * マス目を廃止した以上、盤面サイズも刻みではなく自由に決められた方が素直。
 * 右端=幅、下端=高さ、右下=両方。アイテムや手書きの線を切り落とす縮小はできない。
 * ドラッグ中は scale（画面幅フィット倍率）を据え置き、指の動きと紙の端が
 * 1:1で付いてくるようにする（毎フレーム再フィットすると端が逃げて掴めない）。
 * 離した時に renderAll で改めてフィットさせる */
const GRIP_W = 18; // グリップ帯の太さ(px)

function positionGrips(){
  const sz = board().size;
  const gw = sz.w * scale, gh = sz.h * scale;
  const PAD = 18; // boardWrapの上・左padding
  gripW.style.left = (PAD + gw) + 'px';
  gripW.style.top = PAD + 'px';
  gripW.style.width = GRIP_W + 'px';
  gripW.style.height = gh + 'px';
  gripH.style.left = PAD + 'px';
  gripH.style.top = (PAD + gh) + 'px';
  gripH.style.width = gw + 'px';
  gripH.style.height = GRIP_W + 'px';
  gripWH.style.left = (PAD + gw) + 'px';
  gripWH.style.top = (PAD + gh) + 'px';
  gripWH.style.width = GRIP_W + 'px';
  gripWH.style.height = GRIP_W + 'px';
}

// 縮小の下限＝いま置いてあるものが収まる大きさ（アイテムと手書きの右端・下端）
function contentExtent(){
  const ink = inkBounds();
  let w = BOARD_MIN, h = BOARD_MIN;
  for (const it of items()){
    w = Math.max(w, it.x + it.w);
    h = Math.max(h, it.y + it.h);
  }
  return { w: Math.ceil(Math.max(w, ink.maxX)), h: Math.ceil(Math.max(h, ink.maxY)) };
}

// 盤面サイズを即時反映（再描画はしない＝ドラッグ中に使う軽い経路）
function applyBoardSize(w, h){
  const sz = board().size;
  sz.w = w; sz.h = h;
  const gw = w * scale, gh = h * scale;
  gridEl.style.width = gw + 'px';
  gridEl.style.height = gh + 'px';
  inkEl.setAttribute('viewBox', `0 0 ${w} ${h}`);
  inkEl.setAttribute('width', gw);
  inkEl.setAttribute('height', gh);
  positionGrips();
}

function showGripLabel(clientX, clientY){
  const sz = board().size;
  const wr = boardWrap.getBoundingClientRect();
  gripLabel.textContent = `${sz.w} × ${sz.h}`;
  gripLabel.style.left = (clientX - wr.left + 14) + 'px';
  gripLabel.style.top = (clientY - wr.top + 14) + 'px';
  gripLabel.hidden = false;
}

function startBoardResize(e, axis){
  if (state.boardResize || state.drag || state.resize || state.ink || state.placing) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();   // グリップ上のテキスト選択・スクロール開始を止める
  e.stopPropagation();
  commitEditor();
  const sz = board().size;
  state.boardResize = {
    pointerId: e.pointerId, axis, el: e.currentTarget,
    startX: e.clientX, startY: e.clientY,
    w0: sz.w, h0: sz.h, min: contentExtent(),
  };
  try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(_){}
  e.currentTarget.classList.add('active');
  showGripLabel(e.clientX, e.clientY);
}

function boardResizeMove(e){
  const r = state.boardResize;
  const sz = board().size;
  let w = sz.w, h = sz.h;
  if (r.axis.includes('w'))
    w = clamp(Math.round(r.w0 + (e.clientX - r.startX) / scale), r.min.w, BOARD_MAX);
  if (r.axis.includes('h'))
    h = clamp(Math.round(r.h0 + (e.clientY - r.startY) / scale), r.min.h, BOARD_MAX);
  if (w !== sz.w || h !== sz.h) applyBoardSize(w, h);
  showGripLabel(e.clientX, e.clientY);
}

function endBoardResize(cancelled){
  const r = state.boardResize;
  if (!r) return;
  state.boardResize = null;
  try{ r.el.releasePointerCapture(r.pointerId); }catch(_){}
  r.el.classList.remove('active');
  gripLabel.hidden = true;
  if (cancelled) applyBoardSize(r.w0, r.h0);
  const changed = board().size.w !== r.w0 || board().size.h !== r.h0;
  renderAll(); // 据え置いていた画面幅フィット倍率をここで計算し直す
  if (changed) scheduleSave();
}

// 矢印キーでも動かせるようにしておく（±ボタンが担っていたキーボード操作の受け皿）
function gripKey(e, axis){
  const step = e.shiftKey ? BOARD_STEP * 4 : BOARD_STEP;
  let dw = 0, dh = 0;
  if (axis.includes('w')){
    if (e.key === 'ArrowRight') dw = step;
    else if (e.key === 'ArrowLeft') dw = -step;
  }
  if (axis.includes('h')){
    if (e.key === 'ArrowDown') dh = step;
    else if (e.key === 'ArrowUp') dh = -step;
  }
  if (!dw && !dh) return;
  e.preventDefault();
  e.stopPropagation();
  const sz = board().size, min = contentExtent();
  const w = clamp(sz.w + dw, min.w, BOARD_MAX);
  const h = clamp(sz.h + dh, min.h, BOARD_MAX);
  if (w === sz.w && h === sz.h) return;
  applyBoardSize(w, h);
  renderAll();
  scheduleSave();
}

for (const [el, axis] of [[gripW, 'w'], [gripH, 'h'], [gripWH, 'wh']]){
  el.addEventListener('pointerdown', e => startBoardResize(e, axis));
  el.addEventListener('keydown', e => gripKey(e, axis));
}

/* ---------- アイテムのドラッグ移動 ---------- */
function onItemPointerDown(e){
  if (state.mode !== 'select') return;
  if (state.drag || state.resize || state.pending || state.placing ||
      state.marquee || state.pendingMarquee) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const id = e.currentTarget.dataset.id;
  commitEditor();
  const rect = e.currentTarget.getBoundingClientRect();
  const s = {
    id,
    pointerId: e.pointerId,
    isTouch: e.pointerType !== 'mouse',
    startX: e.clientX, startY: e.clientY,
    grabDX: e.clientX - rect.left,
    grabDY: e.clientY - rect.top,
    lpTimer: null
  };
  state.pending = s;
  if (s.isTouch){
    // 長押しでドラッグモード開始。それまでの指の移動はスクロールに委ねる
    s.lpTimer = setTimeout(() => {
      if (state.pending === s) startDrag(s);
    }, LONG_PRESS_MS);
  }
}

function startDrag(s){
  state.pending = null;
  const b = getItem(s.id);
  const el = itemEls.get(s.id);
  if (!b || !el) return;
  // 複数選択中のアイテムを掴んだ場合は選択グループ全体を一緒に動かす。
  // members は掴んだアイテム(アンカー)からの相対座標を持つ
  const groupIds = (state.selIds.length > 1 && state.selIds.includes(s.id))
    ? [...state.selIds] : [s.id];
  if (groupIds.length === 1) select(s.id);
  state.drag = {
    id: s.id, pointerId: s.pointerId,
    grabDX: s.grabDX, grabDY: s.grabDY,
    members: groupIds.map(id => {
      const mb = getItem(id);
      return { id, rx: mb.x - b.x, ry: mb.y - b.y, w: mb.w, h: mb.h };
    }),
    bx: b.x, by: b.y, moved: false
  };
  try{ el.setPointerCapture(s.pointerId); }catch(_){}
  for (const m of state.drag.members) itemEls.get(m.id)?.classList.add('dragging');
  updateTextPreview(); // ドラッグ中はポップオーバーを隠す
  if (navigator.vibrate) navigator.vibrate(10);
}

function dragMove(e){
  const d = state.drag;
  const el = itemEls.get(d.id);
  if (!el) return;
  const gr = gridEl.getBoundingClientRect();
  // 掴んだ点との相対を保った、アンカーの盤面座標
  let bx = (e.clientX - gr.left - d.grabDX) / scale;
  let by = (e.clientY - gr.top - d.grabDY) / scale;
  // グループ全員が盤内に収まる範囲にアンカーをクランプ（自由座標・スナップなし）
  const sz = board().size;
  let xLo = 0, xHi = sz.w, yLo = 0, yHi = sz.h;
  for (const m of d.members){
    xLo = Math.max(xLo, -m.rx);
    xHi = Math.min(xHi, sz.w - m.rx - m.w);
    yLo = Math.max(yLo, -m.ry);
    yHi = Math.min(yHi, sz.h - m.ry - m.h);
  }
  d.bx = clamp(bx, xLo, Math.max(xLo, xHi));
  d.by = clamp(by, yLo, Math.max(yLo, yHi));
  d.moved = true;
  for (const m of d.members){
    const mel = itemEls.get(m.id);
    if (!mel) continue;
    const isImg = getItem(m.id)?.type === 'image';
    mel.style.left = ((d.bx + m.rx) * scale + (isImg ? 0 : 2)) + 'px';
    mel.style.top = ((d.by + m.ry) * scale + (isImg ? 0 : 2)) + 'px';
  }
}

function endDrag(cancelled){
  const d = state.drag;
  if (!d) return;
  state.drag = null;
  const b = getItem(d.id), el = itemEls.get(d.id);
  if (!b || !el) return;
  try{ el.releasePointerCapture(d.pointerId); }catch(_){}
  const apply = !cancelled && d.moved && (d.bx !== b.x || d.by !== b.y);
  for (const m of d.members){
    const mb = getItem(m.id), mel = itemEls.get(m.id);
    if (!mb || !mel) continue;
    mel.classList.remove('dragging');
    if (apply){ mb.x = r1(d.bx + m.rx); mb.y = r1(d.by + m.ry); clampItem(mb); }
    layoutItem(mb); // 中止時は元位置へ戻す
  }
  if (apply) scheduleSave();
  updateToolbar();
  updateTextPreview();
}

/* ---------- リサイズ（右下ハンドル・自由サイズ） ----------
 * 画像は既定で縦横比を保つ（Shiftを押している間は自由変形）。ブロックは常に自由 */
function onHandlePointerDown(e){
  if (state.mode !== 'select') return;
  if (state.drag || state.resize) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.stopPropagation();
  const id = e.currentTarget.parentElement.dataset.id;
  const b = getItem(id);
  if (!b) return;
  commitEditor();
  state.resize = { id, pointerId: e.pointerId, w: b.w, h: b.h,
                   ar: b.w / b.h, moved: false };
  try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(_){}
  updateTextPreview();
}

function resizeMove(e){
  const r = state.resize;
  const b = getItem(r.id), el = itemEls.get(r.id);
  if (!b || !el) return;
  const sz = board().size;
  const pt = boardPoint(e.clientX, e.clientY);
  let w = clamp(pt.x - b.x, ITEM_MIN, sz.w - b.x);
  let h = clamp(pt.y - b.y, ITEM_MIN, sz.h - b.y);
  if (b.type === 'image' && !e.shiftKey){
    // 縦横比を保つ: 幅基準で高さを決め、はみ出すなら高さ基準に切り替える
    h = w / r.ar;
    if (h > sz.h - b.y || h < ITEM_MIN){
      h = clamp(h, ITEM_MIN, sz.h - b.y);
      w = clamp(h * r.ar, ITEM_MIN, sz.w - b.x);
    }
  }
  if (w !== r.w || h !== r.h){
    r.w = w; r.h = h; r.moved = true;
    const pad = b.type === 'image' ? 0 : 4;
    el.style.width = Math.max(1, w * scale - pad) + 'px';
    el.style.height = Math.max(1, h * scale - pad) + 'px';
  }
}

function endResize(cancelled){
  const r = state.resize;
  if (!r) return;
  state.resize = null;
  const b = getItem(r.id), el = itemEls.get(r.id);
  if (!b || !el) return;
  if (!cancelled && r.moved && (r.w !== b.w || r.h !== b.h)){
    b.w = r1(r.w); b.h = r1(r.h);
    clampItem(b);
    scheduleSave();
  }
  layoutItem(b); // 中止時は元サイズへ戻す
  updateToolbar();
  updateTextPreview();
}

/* ---------- 下地へのポインタ操作 ----------
 * 選択モード: 範囲選択（PCはドラッグ、モバイルは長押しで開始）
 * ペン / 消しゴムモード: 下地への手書き（指1本で描き、2本指でスクロール） */
gridEl.addEventListener('pointerdown', e => {
  if (e.target !== gridEl && e.target !== inkEl) return; // アイテム上はアイテム側に任せる
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  if (state.mode !== 'select'){ inkPointerDown(e); return; }
  if (state.drag || state.resize || state.pending || state.placing ||
      state.marquee || state.pendingMarquee) return;
  const s = {
    pointerId: e.pointerId,
    isTouch: e.pointerType !== 'mouse',
    startX: e.clientX, startY: e.clientY,
    lpTimer: null
  };
  state.pendingMarquee = s;
  if (s.isTouch){
    s.lpTimer = setTimeout(() => {
      if (state.pendingMarquee === s) startMarquee(s);
    }, LONG_PRESS_MS);
  }
});

function startMarquee(s){
  state.pendingMarquee = null;
  commitEditor();
  deselect();
  state.marquee = { pointerId: s.pointerId, startX: s.startX, startY: s.startY };
  try{ gridEl.setPointerCapture(s.pointerId); }catch(_){}
  const gr = gridEl.getBoundingClientRect();
  marqueeEl.style.left = (s.startX - gr.left) + 'px';
  marqueeEl.style.top = (s.startY - gr.top) + 'px';
  marqueeEl.style.width = '0px';
  marqueeEl.style.height = '0px';
  marqueeEl.hidden = false;
  updateTextPreview();
  if (navigator.vibrate) navigator.vibrate(10);
}

function marqueeMove(e){
  const m = state.marquee;
  const gr = gridEl.getBoundingClientRect();
  const sz = board().size;
  const x1 = clamp(Math.min(m.startX, e.clientX) - gr.left, 0, sz.w * scale);
  const y1 = clamp(Math.min(m.startY, e.clientY) - gr.top, 0, sz.h * scale);
  const x2 = clamp(Math.max(m.startX, e.clientX) - gr.left, 0, sz.w * scale);
  const y2 = clamp(Math.max(m.startY, e.clientY) - gr.top, 0, sz.h * scale);
  marqueeEl.style.left = x1 + 'px';
  marqueeEl.style.top = y1 + 'px';
  marqueeEl.style.width = (x2 - x1) + 'px';
  marqueeEl.style.height = (y2 - y1) + 'px';
  // 矩形に重なったアイテムを選択（ライブ更新）
  const rect = { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
  setSelection(items().filter(b => rectsOverlap(rect,
    { x: b.x * scale, y: b.y * scale, w: b.w * scale, h: b.h * scale }
  )).map(b => b.id));
}

function endMarquee(cancelled){
  const m = state.marquee;
  if (!m) return;
  state.marquee = null;
  marqueeEl.hidden = true;
  try{ gridEl.releasePointerCapture(m.pointerId); }catch(_){}
  if (cancelled) deselect();
  updateToolbar(); // 選択があればここで初めてツールバーを出す
  updateTextPreview();
}

/* ============================================================
 * 下地への手書き（Phase 5・③「マス目をなくした下地を書けるキャンバスに」）
 * - ストロークは盤面座標の点列で持ち、SVGのpathとして下地に描く
 *   （アイテムより下のレイヤ。ズームしても線が滲まない）
 * - 指1本で描き、2本指で盤面スクロール（ペン中はtouch-action:noneのため
 *   ブラウザのパンが効かないので、2本指のときは自前でスクロールさせる）
 * - 消しゴみはストローク単位。触れた線をまるごと消す（部分消しは持たない）
 * ============================================================ */
const inkPointers = new Map(); // pointerId -> {x, y}（ペン系モードで押している指）
function setMode(mode){
  if (state.mode === mode) return;
  abortInk();
  state.mode = mode;
  if (mode !== 'select'){
    commitEditor();
    cancelPlacing();
    deselect();
  }
  gridEl.classList.toggle('mode-ink', mode !== 'select');
  gridEl.classList.toggle('mode-pen', mode === 'pen');
  gridEl.classList.toggle('mode-eraser', mode === 'eraser');
  modeSelectBtn.classList.toggle('active', mode === 'select');
  modePenBtn.classList.toggle('active', mode === 'pen');
  modeEraseBtn.classList.toggle('active', mode === 'eraser');
  penBar.hidden = mode !== 'pen';
  updateToolbar();
  updateTextPreview();
}
modeSelectBtn.addEventListener('click', () => setMode('select'));
modePenBtn.addEventListener('click', () => setMode(state.mode === 'pen' ? 'select' : 'pen'));
modeEraseBtn.addEventListener('click', () => setMode(state.mode === 'eraser' ? 'select' : 'eraser'));

/* ペンの色・太さ（端末ローカル設定） */
function buildPenBar(){
  const colors = $('penColors');
  for (const c of PEN_COLORS){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'pen-sw';
    b.style.background = c;
    b.dataset.color = c;
    b.title = 'ペンの色';
    b.addEventListener('click', () => { setSetting('penColor', c); refreshPenBar(); });
    colors.appendChild(b);
  }
  const widths = $('penWidths');
  for (const w of PEN_WIDTHS){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'pen-w';
    b.dataset.width = w;
    b.title = 'ペンの太さ';
    const dot = document.createElement('i');
    const px = Math.max(3, Math.round(w * 2.2));
    dot.style.width = px + 'px';
    dot.style.height = px + 'px';
    b.appendChild(dot);
    b.addEventListener('click', () => { setSetting('penWidth', w); refreshPenBar(); });
    widths.appendChild(b);
  }
}
function refreshPenBar(){
  const c = penColor(), w = penWidth();
  for (const b of $('penColors').children) b.classList.toggle('active', b.dataset.color === c);
  for (const b of $('penWidths').children) b.classList.toggle('active', Number(b.dataset.width) === w);
  for (const b of $('penWidths').children) b.querySelector('i').style.background = c;
}
buildPenBar();
refreshPenBar();

/* 直前の線を取り消す（手書きは気軽に足すものなので1手だけ戻せると助かる） */
$('penUndo').addEventListener('click', () => {
  if (!strokes().length) return;
  strokes().pop();
  inkEl.lastElementChild?.remove();
  scheduleSave();
});

function inkPointerDown(e){
  inkPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  // 2本目の指 → 描くのをやめて2本指スクロールへ切り替える
  if (inkPointers.size >= 2){
    abortInk();
    startInkPan();
    return;
  }
  if (state.inkPan) return;
  try{ gridEl.setPointerCapture(e.pointerId); }catch(_){}
  if (state.mode === 'pen'){
    startStroke(e);
  } else {
    state.ink = { pointerId: e.pointerId, erasing: true, erased: false };
    eraseAt(e.clientX, e.clientY);
  }
}
function inkPointerMove(e){
  if (inkPointers.has(e.pointerId)) inkPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (state.inkPan){ moveInkPan(); return; }
  const ink = state.ink;
  if (!ink || e.pointerId !== ink.pointerId) return;
  if (ink.erasing){ eraseAt(e.clientX, e.clientY); return; }
  // 取りこぼした中間点も拾って線を滑らかにする
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of (evs.length ? evs : [e])) pushInkPoint(ev.clientX, ev.clientY);
}
function inkPointerUp(e){
  inkPointers.delete(e.pointerId);
  if (state.inkPan){
    if (inkPointers.size < 2) state.inkPan = null;
    return;
  }
  const ink = state.ink;
  if (!ink || e.pointerId !== ink.pointerId) return;
  try{ gridEl.releasePointerCapture(e.pointerId); }catch(_){}
  state.ink = null;
  if (ink.erasing){
    if (ink.erased) scheduleSave();
    return;
  }
  commitStroke(ink);
}
// 描きかけを捨てる（モード切替・2本指スクロール開始・pointercancel）
function abortInk(){
  const ink = state.ink;
  if (!ink) return;
  state.ink = null;
  if (ink.el) ink.el.remove();
  if (ink.erasing && ink.erased) scheduleSave();
}

/* ---- ペン ---- */
function startStroke(e){
  const p = boardPoint(e.clientX, e.clientY);
  const s = { c: penColor(), w: penWidth(), p: [r1(p.x), r1(p.y)] };
  const el = makeStrokeEl(s);
  inkEl.appendChild(el);
  state.ink = { pointerId: e.pointerId, erasing: false, stroke: s, el };
}
function pushInkPoint(clientX, clientY){
  const ink = state.ink;
  if (!ink || !ink.stroke) return;
  const sz = board().size;
  const p = boardPoint(clientX, clientY);
  // 線は盤面の中だけに残す（盤面を縮める判定と食い違わないように）
  const x = clamp(p.x, 0, sz.w), y = clamp(p.y, 0, sz.h);
  const pts = ink.stroke.p;
  const dx = x - pts[pts.length - 2], dy = y - pts[pts.length - 1];
  if (Math.hypot(dx, dy) * scale < INK_MIN_SEG_PX) return; // 細かすぎる点は捨てる
  pts.push(r1(x), r1(y));
  ink.el.setAttribute('d', strokePath(pts));
}
function commitStroke(ink){
  if (!ink || !ink.stroke) return;
  strokes().push(ink.stroke);
  scheduleSave();
}

/* ---- 消しゴム（触れた線をまるごと消す） ---- */
function pointToSegDist(px, py, x1, y1, x2, y2){
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx * dx + dy * dy;
  const t = len2 ? clamp(((px - x1) * dx + (py - y1) * dy) / len2, 0, 1) : 0;
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}
function eraseAt(clientX, clientY){
  const p = boardPoint(clientX, clientY);
  const r = ERASER_R_PX / scale;
  const all = strokes();
  let hit = -1;
  for (let i = all.length - 1; i >= 0 && hit < 0; i--){
    const s = all[i], reach = r + s.w / 2;
    for (let j = 0; j + 3 < s.p.length; j += 2){
      if (pointToSegDist(p.x, p.y, s.p[j], s.p[j + 1], s.p[j + 2], s.p[j + 3]) <= reach){
        hit = i; break;
      }
    }
    if (hit < 0 && s.p.length === 2 && Math.hypot(p.x - s.p[0], p.y - s.p[1]) <= reach) hit = i;
  }
  if (hit < 0) return;
  all.splice(hit, 1);
  inkEl.children[hit]?.remove();
  if (state.ink) state.ink.erased = true;
  else scheduleSave();
}

/* ---- ペンモード中の2本指スクロール ---- */
function inkPointerMid(){
  let x = 0, y = 0, n = 0;
  for (const p of inkPointers.values()){ x += p.x; y += p.y; n++; }
  return n ? { x: x / n, y: y / n } : null;
}
function startInkPan(){
  const mid = inkPointerMid();
  if (!mid) return;
  state.inkPan = { mid, left: scroller.scrollLeft, top: scroller.scrollTop };
}
function moveInkPan(){
  const mid = inkPointerMid();
  if (!mid || !state.inkPan) return;
  scroller.scrollLeft = state.inkPan.left - (mid.x - state.inkPan.mid.x);
  scroller.scrollTop  = state.inkPan.top  - (mid.y - state.inkPan.mid.y);
}

/* ---------- ポインタの共通ハンドラ ---------- */
let lastBoardPoint = null; // 直近のポインタ位置（board-px）。貼り付け位置に使う
window.addEventListener('pointermove', e => {
  if (!boardView.hidden) lastBoardPoint = boardPoint(e.clientX, e.clientY);
  // 盤面サイズの変更はモードによらず（ペン中でも）掴めるので最初に見る
  if (state.boardResize && e.pointerId === state.boardResize.pointerId){ boardResizeMove(e); return; }
  if (state.mode !== 'select'){ inkPointerMove(e); return; }
  if (state.placing){ movePlacing(e.clientX, e.clientY); return; }
  if (state.resize && e.pointerId === state.resize.pointerId){ resizeMove(e); return; }
  if (state.drag && e.pointerId === state.drag.pointerId){ dragMove(e); return; }
  if (state.marquee && e.pointerId === state.marquee.pointerId){ marqueeMove(e); return; }
  const s = state.pending;
  if (s && e.pointerId === s.pointerId){
    const dist = Math.hypot(e.clientX - s.startX, e.clientY - s.startY);
    if (s.isTouch){
      // 長押し成立前に動いた → スクロール操作。ドラッグは開始しない
      if (dist > LP_CANCEL_PX){ clearTimeout(s.lpTimer); state.pending = null; }
    } else if (dist > DRAG_START_PX){
      startDrag(s);
      dragMove(e);
    }
    return;
  }
  const pm = state.pendingMarquee;
  if (pm && e.pointerId === pm.pointerId){
    const dist = Math.hypot(e.clientX - pm.startX, e.clientY - pm.startY);
    if (pm.isTouch){
      // 長押し成立前に動いた → スクロール操作。範囲選択は開始しない
      if (dist > LP_CANCEL_PX){ clearTimeout(pm.lpTimer); state.pendingMarquee = null; }
    } else if (dist > DRAG_START_PX){
      startMarquee(pm);
      marqueeMove(e);
    }
  }
});

window.addEventListener('pointerup', e => {
  if (state.boardResize && e.pointerId === state.boardResize.pointerId){ endBoardResize(false); return; }
  if (state.mode !== 'select'){ inkPointerUp(e); return; }
  if (state.placing){ finishPlacing(e); return; }
  if (state.resize && e.pointerId === state.resize.pointerId){ endResize(false); return; }
  if (state.drag && e.pointerId === state.drag.pointerId){ endDrag(false); return; }
  if (state.marquee && e.pointerId === state.marquee.pointerId){ endMarquee(false); return; }
  const pm = state.pendingMarquee;
  if (pm && e.pointerId === pm.pointerId){
    clearTimeout(pm.lpTimer);
    state.pendingMarquee = null;
    // 範囲選択に至らないタップ → gridElのpointerupハンドラ（選択解除/ダブルタップ作成）に任せる
  }
  const s = state.pending;
  if (s && e.pointerId === s.pointerId){
    clearTimeout(s.lpTimer);
    state.pending = null;
    // ドラッグに至らないタップ/クリック → 選択。選択済みなら
    // ブロックはその場エディタ、画像は拡大表示を開く
    const wasSelected = singleSelId() === s.id;
    select(s.id);
    if (wasSelected){
      const it = getItem(s.id);
      if (it && it.type === 'image') openLightbox(it.name);
      else openEditor(s.id);
    }
  }
});

window.addEventListener('pointercancel', e => {
  if (state.boardResize && e.pointerId === state.boardResize.pointerId){ endBoardResize(true); return; }
  if (state.mode !== 'select'){
    inkPointers.delete(e.pointerId);
    if (state.ink && state.ink.pointerId === e.pointerId) abortInk();
    if (inkPointers.size < 2) state.inkPan = null;
    return;
  }
  if (state.resize && e.pointerId === state.resize.pointerId) endResize(true);
  if (state.drag && e.pointerId === state.drag.pointerId) endDrag(true);
  if (state.marquee && e.pointerId === state.marquee.pointerId) endMarquee(true);
  const pm = state.pendingMarquee;
  if (pm && e.pointerId === pm.pointerId){
    clearTimeout(pm.lpTimer);
    state.pendingMarquee = null;
  }
  const s = state.pending;
  if (s && e.pointerId === s.pointerId){
    clearTimeout(s.lpTimer);
    state.pending = null;
  }
});

// ドラッグ/リサイズ/コピー配置/範囲選択/手書き/盤面サイズ変更の確定後に
// ネイティブスクロールが割り込むのを防ぐ
window.addEventListener('touchmove', e => {
  if (state.drag || state.resize || state.placing || state.marquee ||
      state.ink || state.boardResize) e.preventDefault();
}, { passive: false });

// タッチ長押しのコンテキストメニューを抑止
boardWrap.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- 下地のダブルクリック/ダブルタップでメモブロックを新規作成 ---------- */
let lastTap = null;
gridEl.addEventListener('pointerup', e => {
  if (e.target !== gridEl && e.target !== inkEl) return;
  if (state.mode !== 'select') return; // ペン系モードは筆記が主役
  // 範囲選択直後のpointerupはタップ扱いにしない（windowハンドラが後で終了処理する）
  if (state.drag || state.resize || state.placing || state.marquee) return;
  const now = performance.now();
  if (lastTap && now - lastTap.t < TAP_DOUBLE_MS &&
      Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < TAP_DOUBLE_PX){
    lastTap = null;
    createBlockAt(boardPoint(e.clientX, e.clientY));
  } else {
    lastTap = { t: now, x: e.clientX, y: e.clientY };
    commitEditor();
    deselect();
  }
});

// 自由座標なので「置けない場所」は無い（重なりは許容）。盤面の内側にだけ収める
function createBlockAt(at){
  const p = at || viewCenterPoint();
  const b = clampItem(newBlock(r1(p.x), r1(p.y)));
  items().push(b);
  const el = makeItemEl(b);
  itemEls.set(b.id, el);
  gridEl.appendChild(el);
  layoutItem(b);
  select(b.id);
  scheduleSave();
  openEditor(b.id); // 生成直後にその場エディタを開く
}
addBlockBtn.addEventListener('click', () => {
  setMode('select');
  createBlockAt(null);
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (state.boardResize) endBoardResize(true); // ドラッグ中の盤面サイズ変更を取り消す
  else if (!lightboxEl.hidden) closeLightbox();
  else if (!dbxPickerEl.hidden) closeDbxPicker();
  else if (!settingsModal.hidden) settingsModal.hidden = true;
  else if (state.editing) commitEditor(); // Escも確定扱い
  else if (state.placing) cancelPlacing();
  else if (state.mode !== 'select') setMode('select');
  else deselect();
});

/* ---------- 設定パネル ---------- */
settingsBtn.addEventListener('click', () => {
  for (const r of settingsModal.querySelectorAll('input[name="confirmKey"]')){
    r.checked = r.value === getSetting('editorConfirmKey');
  }
  for (const r of settingsModal.querySelectorAll('input[name="paperStyle"]')){
    r.checked = r.value === paperStyle();
  }
  updateFontScaleUI();
  refreshPaletteEditor();
  settingsModal.hidden = false;
});
$('settingsClose').addEventListener('click', () => { settingsModal.hidden = true; });
settingsModal.addEventListener('pointerdown', e => {
  if (e.target === settingsModal) settingsModal.hidden = true; // 背景タップで閉じる
});

/* ---------- 表示倍率（ズーム） ----------
 * PCでは画面幅フィット(=100%)だとマスが小さく端に寄りがちなので、
 * 倍率を上げて大きく表示できるようにする。倍率は端末ローカルに保存。
 * scale(board-pxあたりの実px)に倍率を掛けるだけなので、D&D等の座標計算はそのまま整合する。 */
function updateZoomUI(){
  zoomLabelBtn.textContent = Math.round(zoom * 100) + '%';
  zoomOutBtn.disabled = zoom <= ZOOM_STEPS[0] + 1e-6;
  zoomInBtn.disabled  = zoom >= ZOOM_STEPS[ZOOM_STEPS.length - 1] - 1e-6;
}
function applyZoom(z, { save = true } = {}){
  const nz = clamp(z, ZOOM_STEPS[0], ZOOM_STEPS[ZOOM_STEPS.length - 1]);
  if (Math.abs(nz - zoom) > 1e-6){
    zoom = nz;
    if (save) setSetting('displayZoom', zoom);
    if (!boardView.hidden) renderAll();
  }
  updateZoomUI();
}
function stepZoom(dir){
  // 現在値に最も近いステップを起点に dir 方向へ1段動かす
  let idx = 0, best = Infinity;
  for (let i = 0; i < ZOOM_STEPS.length; i++){
    const d = Math.abs(ZOOM_STEPS[i] - zoom);
    if (d < best){ best = d; idx = i; }
  }
  if (dir > 0 && ZOOM_STEPS[idx] <= zoom + 1e-6) idx++;
  else if (dir < 0 && ZOOM_STEPS[idx] >= zoom - 1e-6) idx--;
  applyZoom(ZOOM_STEPS[clamp(idx, 0, ZOOM_STEPS.length - 1)]);
}
zoomInBtn.addEventListener('click', () => stepZoom(1));
zoomOutBtn.addEventListener('click', () => stepZoom(-1));
zoomLabelBtn.addEventListener('click', () => applyZoom(1)); // 100%（画面幅フィット）に戻す
updateZoomUI();

// PCキーボード: Ctrl/Cmd + ＋ / − で拡大縮小、Ctrl/Cmd + 0 でフィット
document.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
  if (boardView.hidden || state.editing) return;
  if (e.key === '+' || e.key === '='){ e.preventDefault(); stepZoom(1); }
  else if (e.key === '-' || e.key === '_'){ e.preventDefault(); stepZoom(-1); }
  else if (e.key === '0'){ e.preventDefault(); applyZoom(1); }
});
// Ctrl/Cmd + ホイール（トラックパッドのピンチ含む）でズーム。ページズームは抑止
scroller.addEventListener('wheel', e => {
  if (!(e.ctrlKey || e.metaKey)) return;
  e.preventDefault();
  stepZoom(e.deltaY < 0 ? 1 : -1);
}, { passive: false });

/* ============================================================
 * Phase 3: Dropbox同期（ストレージブリッジ経由・無改造で利用）
 * - ローカル(IndexedDB)が常に一次ストレージ。クラウドはLast-Write-Wins
 * - revベースの競合検知。自動マージはしない（軽量方針）
 * ============================================================ */
const bridgeAvailable = !!window.__PB_TEST_BRIDGE || typeof StorageBridge !== 'undefined';
let storage = null;
let cloudBusy = false;        // アップロード/ダウンロード実行中
let cloudTimer = null;        // アップロードのデバウンスタイマー
let conflictPending = null;   // 競合ダイアログ表示中 { name, rec, meta }
let cloudReady = false;

if (bridgeAvailable){
  // __PB_TEST_BRIDGE は自動テスト用のフェイク実装差し込みフック
  storage = window.__PB_TEST_BRIDGE || new StorageBridge({
    basePath: '/PlotBoard',
    storagePrefix: 'plotboard',
    ui: true,              // ブリッジ標準の接続UI（タイトル一覧ヘッダに表示）
    uiTarget: '#dbxMount',
  });
  storage.on('connected', onCloudConnected);
  storage.on('disconnected', () => {
    cloudReady = false;
    updateSyncUI();
    if (!titleView.hidden) refreshTitleList();
  });
  storage.on('error', e => console.warn('[sync]', e));
  if (storage.isConnected) queueMicrotask(onCloudConnected);
}
function canCloud(){ return !!(storage && storage.isConnected); }

async function onCloudConnected(){
  if (cloudReady) return;
  cloudReady = true;
  imgFailed.clear(); // 未取得だった画像をダウンロードできるように
  updateSyncUI();
  if (!titleView.hidden) await refreshTitleList();
  if (!boardView.hidden) renderAll();
  syncDirtyAll();
}

// rev取得（get_metadata）。ブリッジ未提供のAPIなので、ブリッジ本体は改造せず
// 期限切れ自動リトライ付きの内部fetch(_apiFetch)を利用する薄いラッパーで補う
async function dbxMeta(name){
  try{
    return await storage._apiFetch('files/get_metadata', {
      path: storage._resolve(name + '.json'),
    });
  }catch(e){
    if (String(e.message).includes('not_found')) return null;
    throw e;
  }
}

function scheduleCloudUpload(){
  if (!canCloud() || !state.currentName) return;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(() => syncNow(), CLOUD_DEBOUNCE_MS);
}

// 未アップロード画像（pendingImgs）をDropboxへ。JSONアップロードの直前に呼び、
// 参照先ファイルがJSONより先に存在するようにする。失敗分はpendingImgsに残り、
// 次のsyncNow（JSON同期と同じトリガ・リトライ系統）で再試行される
async function uploadPendingImages(name, rec){
  const pend = rec.pendingImgs || [];
  if (!pend.length) return;
  const referenced = docImageSet(rec.doc);
  const rest = [];
  for (const fn of pend){
    if (!referenced.has(fn)) continue; // 追加後すぐ外された画像。アップロード不要
    let blob = null;
    try{ blob = await idbImgGet(name, fn); }catch(_){}
    if (!blob) continue; // キャッシュ喪失。アップロードのしようがない
    try{
      await storage.save(name + '/img/' + fn, blob);
      imgFailed.delete(imgKey(name, fn));
    }catch(e){
      console.warn('[img] アップロード失敗:', fn, e);
      rest.push(fn);
    }
  }
  rec.pendingImgs = rest;
}

// アップロード（rev比較つき）。rev不一致＝他端末の更新 → 競合ダイアログ
async function syncNow(name){
  name = name || state.currentName;
  if (!name) return;
  clearTimeout(cloudTimer); cloudTimer = null;
  if (!canCloud() || !navigator.onLine || conflictPending){ updateSyncUI(); return; }
  const rec = (state.currentName === name && state.rec) ? state.rec : await idbTitleGet(name);
  if (!rec || !rec.dirty){ updateSyncUI(); return; }
  cloudBusy = true; updateSyncUI();
  try{
    const meta = await dbxMeta(name);
    // rev不一致（他端末の更新、または初回アップロード時に同名ファイルが既にある）
    if (meta && meta.rev !== rec.rev){
      openConflict(name, rec, meta);
      return;
    }
    await uploadPendingImages(name, rec);
    const res = await storage.save(name + '.json', JSON.stringify(rec.doc));
    rec.rev = res.rev;
    // 画像のアップロードが残っていればdirtyのままにして次の同期トリガで再試行
    rec.dirty = (rec.pendingImgs || []).length > 0;
    rec.syncedAt = new Date().toISOString();
    await idbTitlePut(rec);
    // 不要画像の掃除はJSONアップロード成功直後（ローカルが正になった時点）のみ
    await gcImages(name, rec.doc);
  }catch(e){
    console.warn('[sync] アップロード失敗:', e);
  }finally{
    cloudBusy = false;
    updateSyncUI();
    if (!titleView.hidden) refreshTitleList();
  }
}

/* ---------- 不要画像の掃除（ガベージコレクト） ----------
 * いまアップロードしたJSONのどのブロックのimagesにも含まれないファイルを、
 * Dropboxの /{タイトル名}/img/ とIndexedDBキャッシュから静かに削除する。
 * オフライン時・アップロード失敗時・競合時は呼ばれない（syncNow成功後のみ） */
async function gcImages(name, doc){
  const referenced = docImageSet(doc);
  // Dropbox側。フォルダ一覧はブリッジのlist()だと未存在時にフォルダを作って
  // しまう（クラッタ）ため、dbxMetaと同じ方針で_apiFetchを直接使う
  try{
    let entries = [], cursor = null, hasMore = true;
    while (hasMore){
      const d = cursor
        ? await storage._apiFetch('files/list_folder/continue', { cursor })
        : await storage._apiFetch('files/list_folder', {
            path: storage._resolve(name + '/img'), recursive: false });
      entries = entries.concat(d.entries);
      cursor = d.cursor;
      hasMore = d.has_more;
    }
    for (const ent of entries){
      if (ent['.tag'] !== 'file' || referenced.has(ent.name)) continue;
      try{ await storage.delete(name + '/img/' + ent.name); }
      catch(e){ console.warn('[img] GC削除に失敗:', ent.name, e); }
    }
  }catch(e){
    // フォルダ未作成（画像を一度も同期していない）は正常系
    if (!String(e.message).includes('not_found')) console.warn('[img] GC一覧に失敗:', e);
  }
  // ローカルキャッシュ側
  try{
    for (const k of await idbImgKeys(name)){
      const fn = k.slice(name.length + 1);
      if (referenced.has(fn)) continue;
      await idbImgDelete(name, fn);
      const url = imgURLs.get(k);
      if (url){ URL.revokeObjectURL(url); imgURLs.delete(k); }
      imgFailed.delete(k);
    }
  }catch(e){
    console.warn('[img] GCキャッシュ削除に失敗:', e);
  }
}

// 未同期(dirty)の全作品をアップロード（接続時・オンライン復帰時）
async function syncDirtyAll(){
  if (syncDirtyAll._busy) return;
  syncDirtyAll._busy = true;
  try{
    // 開いている作品の未保存分を先にIndexedDBへ（dirty判定はIDBのレコードで行うため）
    if (saveTimer) await flushSave();
    const all = await idbTitlesAll();
    for (const rec of all){
      if (!canCloud() || conflictPending) break;
      if (rec.dirty) await syncNow(rec.name);
    }
  }finally{
    syncDirtyAll._busy = false;
  }
}
window.addEventListener('online', () => {
  imgFailed.clear(); // オフラインプレースホルダの画像を取り直せるように
  updateSyncUI();
  if (canCloud()) syncDirtyAll();
  if (!boardView.hidden) renderAll();
});
window.addEventListener('offline', updateSyncUI);

syncBtn.addEventListener('click', async () => {
  if (saveTimer) await flushSave();
  syncNow();
});

/* ---------- 競合ダイアログ（2択＋保留） ---------- */
function openConflict(name, rec, meta){
  conflictPending = { name, rec, meta };
  $('conflictDesc').textContent =
    `「${name}」はこの端末での変更とは別に、他の端末で更新されています。` +
    `どちらの内容を残すか選んでください（自動では統合されません）。`;
  conflictModal.hidden = false;
  updateSyncUI();
}
async function resolveConflict(choice){
  const c = conflictPending;
  conflictPending = null;
  conflictModal.hidden = true;
  if (!c || choice === 'later'){ updateSyncUI(); return; }
  const { name, rec } = c;
  cloudBusy = true; updateSyncUI();
  try{
    if (choice === 'mine'){
      // この端末の内容で上書き（syncNow成功時と同じ扱い: 画像→JSON→GC）
      await uploadPendingImages(name, rec);
      const res = await storage.save(name + '.json', JSON.stringify(rec.doc));
      rec.rev = res.rev;
      rec.dirty = (rec.pendingImgs || []).length > 0;
      rec.syncedAt = new Date().toISOString();
      await idbTitlePut(rec);
      await gcImages(name, rec.doc);
    }else{
      // クラウドの内容を読み込む（この端末の変更は破棄）
      const text = await storage.load(name + '.json');
      const meta = await dbxMeta(name);
      rec.doc = await migrateDoc(name, JSON.parse(text));
      rec.doc.title = name;
      rec.rev = meta ? meta.rev : null;
      rec.dirty = false;
      rec.updatedAt = rec.doc.updatedAt || new Date().toISOString();
      rec.syncedAt = new Date().toISOString();
      await idbTitlePut(rec);
      imgFailed.clear(); // 他端末が上げた画像を取り直せるように
      if (state.currentName === name){
        state.rec = rec;
        state.doc = rec.doc;
        deselect();
        renderAll();
      }
    }
  }catch(e){
    console.warn('[sync] 競合解決に失敗:', e);
    rec.dirty = true;
  }finally{
    cloudBusy = false;
    updateSyncUI();
    if (!titleView.hidden) refreshTitleList();
  }
}
$('conflictMine').addEventListener('click', () => resolveConflict('mine'));
$('conflictCloud').addEventListener('click', () => resolveConflict('cloud'));
$('conflictLater').addEventListener('click', () => resolveConflict('later'));

/* ============================================================
 * タイトル（作品）管理
 * ============================================================ */
let remoteEntries = []; // 直近に取得したDropbox側ファイル一覧

function fmtDate(iso){
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return '—';
  return `${d.getMonth() + 1}/${d.getDate()} ` +
         `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

async function refreshTitleList(){
  const locals = await idbTitlesAll();
  remoteEntries = [];
  if (canCloud()){
    try{
      remoteEntries = (await storage.list())
        .filter(e => e['.tag'] === 'file' && e.name.toLowerCase().endsWith('.json'));
    }catch(e){
      console.warn('[sync] 一覧取得失敗:', e);
    }
  }
  // ローカルとクラウドをマージ
  const items = new Map();
  for (const rec of locals) items.set(rec.name, { name: rec.name, rec, remote: null });
  for (const ent of remoteEntries){
    const name = ent.name.replace(/\.json$/i, '');
    const it = items.get(name);
    if (it) it.remote = ent;
    else items.set(name, { name, rec: null, remote: ent });
  }
  const arr = [...items.values()].sort((a, b) => {
    const ta = a.rec?.updatedAt || a.remote?.server_modified || '';
    const tb = b.rec?.updatedAt || b.remote?.server_modified || '';
    return tb.localeCompare(ta);
  });
  titleListEl.textContent = '';
  $('titleEmpty').hidden = arr.length > 0;
  for (const it of arr) titleListEl.appendChild(makeTitleRow(it));
}

function titleStatus(it){
  if (!it.rec)          return { cls: 'st-cloud',   label: 'クラウドのみ' };
  if (it.rec.dirty)     return { cls: 'st-pending', label: '同期待ち' };
  if (!canCloud())      return it.rec.rev ? { cls: 'st-synced', label: '同期済み' }
                                          : { cls: 'st-local',  label: 'ローカルのみ' };
  if (!it.remote)       return { cls: 'st-local',   label: 'ローカルのみ' };
  if (it.remote.rev === it.rec.rev) return { cls: 'st-synced', label: '同期済み' };
  return { cls: 'st-newer', label: 'クラウドに更新あり' };
}

function makeTitleRow(it){
  const li = document.createElement('li');
  li.className = 'tl-item';
  const main = document.createElement('div');
  main.className = 'tl-main';
  const nm = document.createElement('div');
  nm.className = 'tl-name';
  nm.textContent = it.name;
  const sub = document.createElement('div');
  sub.className = 'tl-sub';
  const date = document.createElement('span');
  date.textContent = fmtDate(it.rec?.updatedAt || it.remote?.server_modified);
  const st = titleStatus(it);
  const chip = document.createElement('span');
  chip.className = 'tl-chip ' + st.cls;
  chip.textContent = st.label;
  sub.append(date, chip);
  main.append(nm, sub);
  main.addEventListener('click', () => openTitle(it.name));
  li.appendChild(main);
  const dup = document.createElement('button');
  dup.className = 'tl-act';
  dup.title = '複製';
  dup.textContent = '⧉';
  dup.addEventListener('click', () => duplicateTitle(it));
  li.appendChild(dup);
  if (it.rec){ // 名前変更はローカルにある作品のみ（クラウドのみは一度開いてから）
    const rn = document.createElement('button');
    rn.className = 'tl-act';
    rn.title = '名前変更';
    rn.textContent = '✎';
    rn.addEventListener('click', () => renameTitle(it.name));
    li.appendChild(rn);
  }
  const del = document.createElement('button');
  del.className = 'tl-act';
  del.title = '削除';
  del.textContent = '🗑';
  del.addEventListener('click', () => deleteTitle(it));
  li.appendChild(del);
  return li;
}

/* ---- 名前入力モーダル（新規作成/名前変更 共用） ---- */
let nameCb = null, nameExclude = null;
function openNameModal(title, initial, cb, exclude){
  $('nameModalTitle').textContent = title;
  nameInput.value = initial || '';
  nameError.hidden = true;
  nameModal.hidden = false;
  nameCb = cb;
  nameExclude = exclude || null;
  nameInput.focus();
  nameInput.select();
}
function closeNameModal(){
  nameModal.hidden = true;
  nameCb = null;
  nameExclude = null;
}
async function validateName(name){
  if (!name) return 'タイトルを入力してください';
  if (NAME_FORBIDDEN.test(name)) return '使用できない文字が含まれています: \\ / : ? * " < > |';
  if (name.length > 80) return 'タイトルが長すぎます（80文字まで）';
  if (nameExclude && name === nameExclude) return null; // リネームで名前そのまま
  const lower = name.toLowerCase();
  const locals = await idbTitlesAll();
  if (locals.some(r => r.name.toLowerCase() === lower) ||
      remoteEntries.some(e => e.name.toLowerCase() === lower + '.json')){
    return '同名の作品がすでにあります';
  }
  return null;
}
async function submitName(){
  const name = nameInput.value.trim();
  const err = await validateName(name);
  if (err){
    nameError.textContent = err;
    nameError.hidden = false;
    return;
  }
  const cb = nameCb;
  closeNameModal();
  if (cb) cb(name);
}
$('nameOk').addEventListener('click', submitName);
$('nameCancel').addEventListener('click', closeNameModal);
nameInput.addEventListener('keydown', e => {
  e.stopPropagation();
  if (e.key === 'Enter') submitName();
  else if (e.key === 'Escape') closeNameModal();
});
nameModal.addEventListener('pointerdown', e => {
  if (e.target === nameModal) closeNameModal();
});

/* ---- 名前変更 ----
 * 同期済み作品はDropbox側のリネーム(move)も伴うため、オフライン中は不可
 * （採用理由: 「次回同期時に反映」方式はリネーム待ちキューの管理が増えるため） */
async function renameTitle(oldName){
  const rec = await idbTitleGet(oldName);
  if (!rec) return;
  if (rec.rev && !canCloud()){
    alert('同期済みの作品の名前変更にはDropbox接続が必要です（オフライン中は不可）');
    return;
  }
  openNameModal('名前変更', oldName, async (newName) => {
    if (newName === oldName) return;
    try{
      if (rec.rev && canCloud()){
        const mv = await storage.move(oldName + '.json', newName + '.json');
        rec.rev = mv?.metadata?.rev || rec.rev; // moveでrevが変わる
        // 画像フォルダ（/{旧名}/）も作品名に追従して移動。無ければ何もしない
        try{
          await storage.move(oldName, newName);
        }catch(e){
          if (!String(e.message).includes('not_found')){
            // 移動に失敗しても表示は壊さない: キャッシュから再アップロード
            // させて新パスに実体を作る（旧パスの残骸は放置される）
            console.warn('[img] 画像フォルダの移動に失敗:', e);
            rec.pendingImgs = [...new Set([...(rec.pendingImgs || []), ...docImageSet(rec.doc)])];
            rec.dirty = true;
          }
        }
      }
      // IndexedDBキャッシュとobjectURLのキー（タイトル名/ファイル名）も付け替え
      await idbImgRenameTitle(oldName, newName);
      for (const [k, v] of [...imgURLs]){
        if (k.startsWith(oldName + '/')){
          imgURLs.delete(k);
          imgURLs.set(newName + k.slice(oldName.length), v);
        }
      }
      for (const k of [...imgFailed]){
        if (k.startsWith(oldName + '/')) imgFailed.delete(k);
      }
      rec.name = newName;
      rec.doc.title = newName;
      rec.updatedAt = new Date().toISOString();
      if (!rec.rev) rec.dirty = true;
      await idbTitlePut(rec);
      await idbTitleDelete(oldName);
      if (state.currentName === oldName){
        state.currentName = newName;
        boardTitleEl.textContent = newName;
      }
      refreshTitleList();
    }catch(e){
      alert('名前変更に失敗しました: ' + e.message);
    }
  }, oldName);
}

/* ---- 複製 ----
 * 元の作品（ローカル／クラウドどちらでも）を丸ごとコピーして新しい作品を作る。
 * 画像はキャッシュ→（無ければ）クラウドから集めて新タイトルのキャッシュへ複製し、
 * pendingImgs に積んで次回同期でDropbox側の /{新名}/img/ にもアップロードさせる。
 * 複製直後はローカル未同期（dirty）扱い。 */
async function duplicateTitle(it){
  // 複製元のドキュメントを用意（ローカルになければクラウドからダウンロード）
  let srcDoc = it.rec?.doc;
  if (!srcDoc){
    if (!canCloud()){
      alert('クラウドのみの作品の複製にはDropbox接続が必要です（オフライン中は不可）');
      return;
    }
    try{
      const text = await storage.load(it.name + '.json');
      srcDoc = await migrateDoc(it.name, JSON.parse(text));
    }catch(e){
      alert('複製元のダウンロードに失敗しました: ' + e.message);
      return;
    }
  }
  // 既定の複製名（「〜 のコピー」。重複していれば連番を付す）
  const locals = await idbTitlesAll();
  const taken = new Set([
    ...locals.map(r => r.name.toLowerCase()),
    ...remoteEntries.map(e => e.name.replace(/\.json$/i, '').toLowerCase()),
  ]);
  const baseName = (it.name + ' のコピー').slice(0, 80);
  let suggested = baseName, i = 2;
  while (taken.has(suggested.toLowerCase())){
    suggested = (it.name + ' のコピー' + i++).slice(0, 80);
  }
  openNameModal('複製', suggested, async (newName) => {
    try{
      const now = new Date().toISOString();
      const doc = JSON.parse(JSON.stringify(srcDoc));
      doc.title = newName;
      doc.updatedAt = now;
      doc.device = deviceId;
      // 参照画像を新タイトルのキャッシュへコピー（無ければクラウドから取得）
      const imgs = [...docImageSet(doc)];
      for (const fn of imgs){
        let blob = null;
        try{ blob = await idbImgGet(it.name, fn); }catch(_){}
        if (!blob && canCloud() && navigator.onLine){
          try{
            const buf = await storage.loadBinary(it.name + '/img/' + fn);
            blob = new Blob([buf], { type: imgMime(fn) });
          }catch(_){}
        }
        if (blob) await idbImgPut(newName, fn, blob).catch(() => {});
      }
      const rec = {
        name: newName, doc, rev: null, dirty: true,
        updatedAt: now, syncedAt: null, pendingImgs: imgs,
      };
      await idbTitlePut(rec);
      refreshTitleList();
    }catch(e){
      alert('複製に失敗しました: ' + e.message);
    }
  });
}

/* ---- 削除（ローカルとクラウド両方から） ---- */
async function deleteTitle(it){
  const name = it.name;
  const hasRemote = !!it.remote || !!(it.rec && it.rec.rev);
  if (hasRemote && !canCloud()){
    alert('同期済みの作品の削除にはDropbox接続が必要です（オフライン中は不可）');
    return;
  }
  const msg = hasRemote
    ? `「${name}」を削除します。\nこの端末とDropboxの両方から削除され、元に戻せません。よろしいですか？`
    : `「${name}」を削除します。元に戻せません。よろしいですか？`;
  if (!confirm(msg)) return;
  try{
    if (hasRemote && canCloud()){
      try{ await storage.delete(name + '.json'); }
      catch(e){ if (!String(e.message).includes('not_found')) throw e; }
      // 画像フォルダ（/{タイトル名}/）も削除
      try{ await storage.delete(name); }
      catch(e){ if (!String(e.message).includes('not_found')) throw e; }
    }
    await idbTitleDelete(name);
    // 画像キャッシュとobjectURLも掃除
    await idbImgClearTitle(name).catch(() => {});
    for (const [k, v] of [...imgURLs]){
      if (k.startsWith(name + '/')){ URL.revokeObjectURL(v); imgURLs.delete(k); }
    }
    for (const k of [...imgFailed]){
      if (k.startsWith(name + '/')) imgFailed.delete(k);
    }
    refreshTitleList();
  }catch(e){
    alert('削除に失敗しました: ' + e.message);
  }
}

/* ============================================================
 * ビュー切替（タイトル一覧 ⇔ ボード）
 * ============================================================ */
async function openTitle(name){
  let rec = await idbTitleGet(name);
  if (rec){
    // ローカル保存分が version 1 のままなら開くときに v2 へ変換（元データは退避）
    rec.doc = await migrateDoc(name, rec.doc);
  } else {
    // クラウドのみの作品 → ダウンロードしてローカル化
    if (!canCloud()) return;
    try{
      const text = await storage.load(name + '.json');
      const meta = await dbxMeta(name);
      const doc = await migrateDoc(name, JSON.parse(text));
      doc.title = name;
      rec = {
        name, doc,
        rev: meta ? meta.rev : null,
        dirty: false,
        updatedAt: doc.updatedAt || meta?.server_modified || new Date().toISOString(),
        syncedAt: new Date().toISOString(),
      };
      await idbTitlePut(rec);
    }catch(e){
      alert('ダウンロードに失敗しました: ' + e.message);
      return;
    }
  }
  state.currentName = name;
  state.rec = rec;
  state.doc = rec.doc;
  state.selIds = [];
  setMode('select'); // 作品を開くときは常に選択モードから
  titleView.hidden = true;
  boardView.hidden = false;
  boardTitleEl.textContent = name;
  renderAll();
  updateSyncUI();
  if (canCloud()) checkRemoteUpdate(name); // 開いた直後にクラウドの最新を確認（非同期）
}

// クラウド側が新しければダウンロードして置き換え。ローカルに未同期変更があれば競合
async function checkRemoteUpdate(name){
  try{
    const meta = await dbxMeta(name);
    if (!meta || state.currentName !== name) return;
    const rec = state.rec;
    if (meta.rev === rec.rev) return;
    if (rec.dirty){ openConflict(name, rec, meta); return; }
    const text = await storage.load(name + '.json');
    if (state.currentName !== name) return;
    rec.doc = await migrateDoc(name, JSON.parse(text));
    rec.doc.title = name;
    rec.rev = meta.rev;
    rec.updatedAt = rec.doc.updatedAt || new Date().toISOString();
    rec.syncedAt = new Date().toISOString();
    await idbTitlePut(rec);
    imgFailed.clear(); // 他端末が上げた画像を取り直せるように
    state.doc = rec.doc;
    deselect();
    renderAll();
    updateSyncUI();
  }catch(e){
    console.warn('[sync] 最新確認に失敗:', e);
  }
}

async function showTitleView(){
  // ボードを離れる前に編集状態を閉じて保存・同期をフラッシュ
  commitEditor();
  cancelPlacing();
  setMode('select');
  deselect();
  if (saveTimer) await flushSave();
  const name = state.currentName;
  state.currentName = null;
  state.rec = null;
  boardView.hidden = true;
  titleView.hidden = false;
  await refreshTitleList();
  if (name) syncNow(name); // 裏でアップロード（fire and forget）
}
backBtn.addEventListener('click', showTitleView);

/* ---------- 起動 ---------- */
(async function init(){
  try{
    await openDB();
    // マイグレーション: Phase 2までの単一ボードデータを「無題」として取り込む
    const titles = await idbTitlesAll();
    if (titles.length === 0){
      const legacy = await idbLegacyLoad();
      if (legacy){
        const doc = normalizeDoc(legacy);
        const now = new Date().toISOString();
        doc.title = '無題';
        doc.updatedAt = doc.updatedAt || now;
        doc.device = doc.device || deviceId;
        await idbTitlePut({
          name: '無題', doc,
          rev: null, dirty: true,
          updatedAt: doc.updatedAt, syncedAt: null,
        });
        // 旧データ(docsストア)は万一に備えてそのまま残す（削除しない）
      }
    }
  }catch(err){
    console.error('初期化エラー:', err);
  }
  await refreshTitleList();
  updateSyncUI();
})();
</script>
