<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="プロットボード アプリアイコン">
  <defs>
    <!-- 方眼紙(ボード)の下地 -->
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1f4"/>
    </linearGradient>
    <!-- P を載せるブロック(アクセント青) -->
    <linearGradient id="block" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b9ee6"/>
      <stop offset="1" stop-color="#3a7bc4"/>
    </linearGradient>
    <!-- ブロックの落ち影 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2b4c73" flood-opacity="0.28"/>
    </filter>
    <!-- 角丸ボードでグリッド線を切り抜くためのクリップ -->
    <clipPath id="round">
      <rect x="16" y="16" width="480" height="480" rx="112"/>
    </clipPath>
  </defs>

  <!-- ボード本体 -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#paper)"/>

  <!-- 方眼(グリッド)線 -->
  <g clip-path="url(#round)" stroke="#d5dce3" stroke-width="2">
    <path d="M80 16V496 M144 16V496 M208 16V496 M272 16V496 M336 16V496 M400 16V496 M464 16V496"/>
    <path d="M16 80H496 M16 144H496 M16 208H496 M16 272H496 M16 336H496 M16 400H496 M16 464H496"/>
  </g>

  <!-- P を載せるブロック(プロットボードのブロックを模す) -->
  <g filter="url(#shadow)">
    <rect x="128" y="112" width="256" height="288" rx="34" fill="url(#block)"/>
    <rect x="128" y="112" width="256" height="288" rx="34" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>
  </g>

  <!-- 頭文字 P(角丸ジオメトリの太字レター) -->
  <g transform="translate(256 256) scale(2.72) translate(-48 -50)" fill="#ffffff">
    <path fill-rule="evenodd" d="
      M22 12
      L58 12
      A20 20 0 1 1 58 52
      L42 52
      L42 88
      L22 88
      Z
      M42 27
      L53 27
      A11 11 0 1 1 53 49
      L42 49
      Z"/>
  </g>
</svg>
